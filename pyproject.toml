[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dissent-ecology"
version = "0.1.0"
description = "Budget-aware selection and routing of complementary critics"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dissent-ecology = "dissent_ecology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
